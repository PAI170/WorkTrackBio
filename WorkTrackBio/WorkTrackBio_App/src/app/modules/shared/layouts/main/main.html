<header>
    <nav class="navbar-main">
        <div class="logo-content">
           <img src="assets/images/website-logo.png" alt="Logo de la aplicacion"> 
        </div>

            <lucide-icon [img]="Search" size="24"></lucide-icon>
            <input type="search" placeholder="Buscar Usuario">
        </div>
        <div class="user-profile-content">
            <div class="profile-image">
                <img src="assets/images/profile-photo.png" alt="">
